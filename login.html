<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - SRT STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #111827, #0f172a 45%, #020617);
            color: #e2e8f0;
        }
        .panel {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 24px;
        }
        .input-dark {
            background: #0b1220;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .input-dark:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            transition: 0.2s ease;
        }
        .btn-primary:hover {
            filter: brightness(1.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md panel p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/30 text-red-400 text-2xl mb-4">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-3xl font-extrabold">Admin SRT STORE</h1>
            <p class="text-slate-400 mt-2">Acceso restringido</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-2 text-slate-300">Usuario</label>
                <input id="username" type="text" value="admin" class="input-dark w-full rounded-xl px-3 py-3" />
            </div>
            <div>
                <label class="block text-sm mb-2 text-slate-300">Contraseña</label>
                <input id="password" type="password" value="aniel 2010" class="input-dark w-full rounded-xl px-3 py-3" />
            </div>
            <button id="login-btn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">Entrar al panel</button>
        </div>

        <div id="error" class="hidden mt-4 text-center text-red-400 font-medium"></div>
    </div>

    <script>
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'aniel 2010';

        document.getElementById('login-btn').addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error');

            if (username === ADMIN_USER && password === ADMIN_PASS) {
                localStorage.setItem('srt_admin_logged_in', 'true');
                window.location.href = 'admin.html';
            } else {
                errorBox.textContent = 'Usuario o contraseña incorrectos.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
